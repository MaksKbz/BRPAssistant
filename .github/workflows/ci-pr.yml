name: PR Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check wrapper executable
        run: |
          chmod +x ./gradlew
          ls -lh ./gradlew gradle/wrapper/
      - name: Run debug unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Run Android lint
        run: gradle lintDebug --stacktrace --no-daemon
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 7
