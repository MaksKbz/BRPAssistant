name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable release tag (for example v2.9.31)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble and publish signed release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve requested tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify tag matches app version
        shell: bash
        env:
          EXPECTED: ${{ steps.release.outputs.version }}
        run: |
          ACTUAL=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Tag $EXPECTED does not match versionName $ACTUAL"; exit 1; }
      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
      - name: Sign APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [[ -n "$APK" ]] || { echo 'Release APK not found'; exit 1; }
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks release.p12 --ks-type PKCS12 \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out "BRPAssistant-${{ steps.release.outputs.tag }}.apk" "$APK"
      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "BRPAssistant-${{ steps.release.outputs.tag }}.apk"
      - name: Generate SHA-256
        id: package
        shell: bash
        run: |
          APK="BRPAssistant-${{ steps.release.outputs.tag }}.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA  $APK" > "$APK.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: BRPAssistant ${{ steps.release.outputs.tag }}
          body: |
            ## BRPAssistant ${{ steps.release.outputs.tag }}

            Signed release APK.

            SHA-256: `${{ steps.package.outputs.sha256 }}`
          files: |
            BRPAssistant-${{ steps.release.outputs.tag }}.apk
            BRPAssistant-${{ steps.release.outputs.tag }}.apk.sha256
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
